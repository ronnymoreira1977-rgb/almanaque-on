<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Conectar TikTok | Almanaque ON</title>
<style>body{font-family:system-ui,sans-serif;background:#0b1226;color:#e8edf7;max-width:640px;margin:40px auto;padding:0 16px}
code{display:block;background:#16203a;padding:14px;border-radius:8px;word-break:break-all;font-size:15px;margin:12px 0}
button{background:#f2c14e;border:0;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer}</style></head>
<body><h1>Almanaque ON + TikTok</h1><p id="msg">Lendo o retorno do TikTok...</p><code id="cod"></code>
<button id="bt" hidden>Copiar código</button>
<script>
const q=new URLSearchParams(location.search),c=q.get('code'),e=q.get('error');
const m=document.getElementById('msg'),k=document.getElementById('cod'),b=document.getElementById('bt');
if(c){m.textContent='Autorizado. Copie o código abaixo e cole na janela do robô (vale por poucos minutos):';k.textContent=c;b.hidden=false;
 b.onclick=()=>{navigator.clipboard.writeText(c);b.textContent='Copiado!'};}
else{m.textContent='Não veio código. '+(e?('Erro: '+e+' '+(q.get('error_description')||'')):'Abra esta página pelo robô.');k.hidden=true;}
</script></body></html>
